[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77"]

[project]
name = "rich-click-help-formats"
version = "0.1.0"
description = "Optional Carapace and HTML help formats for rich-click"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Phil Ewels", email = "phil@ewels.co.uk" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6",
    "rich-click>=1.10.0",
]

[project.entry-points."rich_click.help_formats"]
carapace = "rich_click_help_formats.carapace:render"
html = "rich_click_help_formats.html:render"

[project.urls]
Homepage = "https://github.com/ewels/rich-click-help-formats"
Issues = "https://github.com/ewels/rich-click-help-formats/issues"
Repository = "https://github.com/ewels/rich-click-help-formats"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "W"]
ignore = ["D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
