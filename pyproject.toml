[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "rich-click-help-formats"
description = "Optional YAML, HTML, and Carapace help formats for rich-click"
readme = "README.md"
license = "MIT"
authors = [ { name = "Phil Ewels", email = "phil@ewels.co.uk" } ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dynamic = [ "version" ]
dependencies = [
    "pyyaml>=6",
    "rich-click>=1.10",
]
urls.Homepage = "https://github.com/ewels/rich-click-help-formats"
urls.Issues = "https://github.com/ewels/rich-click-help-formats/issues"
urls.Repository = "https://github.com/ewels/rich-click-help-formats"
entry-points."rich_click.help_formats".carapace = "rich_click_help_formats.carapace:render"
entry-points."rich_click.help_formats".html = "rich_click_help_formats.html:render"
entry-points."rich_click.help_formats".yaml = "rich_click_help_formats.yaml:render"

[dependency-groups]
dev = [
    "build>=1.2",
    "mypy>=2.3",
    "prek>=0.4.12",
    "pytest>=8.3.5",
    "pytest-cov>=5",
    "ruff>=0.16.2",
    "twine>=6",
    "ty>=0.0.69",
    "types-pyyaml>=6",
]

[tool.setuptools]
packages.find.where = [ "src" ]
package-data.rich_click_help_formats = [ "py.typed" ]
dynamic.version = { attr = "rich_click_help_formats.__version__" }

[tool.uv]
sources.rich-click = { git = "https://github.com/ewels/rich-click.git", branch = "help-json-v2" }

[tool.ruff]
target-version = "py310"
line-length = 120
lint.select = [ "D", "E", "F", "I001", "UP", "W" ]
lint.ignore = [ "D100", "D102", "D105", "D203", "D205", "D212" ]
lint.per-file-ignores."tests/**/*.py" = [ "D" ]
lint.isort.known-first-party = [ "rich_click_help_formats" ]
lint.isort.lines-after-imports = 2

[tool.pyproject-fmt]
indent = 4

[tool.mypy]
follow_imports = "normal"
python_version = "3.10"
strict = true
scripts_are_modules = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [ "src" ]
executionEnvironments = [
    { root = "src" },
    { root = "tests", extra_paths = [ "src" ] },
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "tests", "src" ]
ini_options.addopts = "-s -rP -v --showlocals --cov=rich_click_help_formats --cov-report term-missing"
